<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Jomba Tech Institute</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="description">
    <span>
      <span class="brand-pill">JOMBATECH</span>
      ACCOUNT RECOVERY
    </span>
  </div>

  <header class="navbar">
    <div class="nav-brand">
      <a href="dashboard.html" class="brand-name">JOMBATECH</a>
    </div>

    <nav class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="computer class.html">Computer Class</a>
      <a href="repair class.html">Repair Class</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <main class="login-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <h2>Reset Your Password</h2>
        <p>Verify your registered email and phone number to set a new password.</p>
      </div>

      <form id="recovery-form" onsubmit="handlePasswordReset(event)">
        
        <div class="form-group">
          <label for="recovery-email">Registered Email Address</label>
          <input type="email" id="recovery-email" required placeholder="student@jombatech.com" class="form-input">
        </div>

        <div class="form-group">
          <label for="recovery-phone">Registered Phone Number</label>
          <input type="tel" id="recovery-phone" required placeholder="e.g., 0712345678" class="form-input">
        </div>

        <!-- New Password with Toggle -->
        <div class="form-group">
          <label for="new-password">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="new-password" required placeholder="••••••••" class="form-input" minlength="6">
            <button type="button" class="toggle-password-btn" id="toggle-new-password" onclick="togglePasswordVisibility('new-password', 'toggle-new-password')">Show</button>
          </div>
        </div>

        <!-- Confirm Password with Toggle -->
        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" required placeholder="••••••••" class="form-input" minlength="6">
            <button type="button" class="toggle-password-btn" id="toggle-confirm-password" onclick="togglePasswordVisibility('confirm-password', 'toggle-confirm-password')">Show</button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Reset Password</button>
      </form>

      <div class="auth-footer">
        <p>Remembered your password? <a href="login.html">Back to Login</a></p>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 JombaTech Institute. All rights reserved.</p>
    </div>
  </footer>

  <script src="forgot password.js"></script>
</body>
</html>
