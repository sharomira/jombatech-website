<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | Jomba Tech Institute</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="description">
    <span>
      <span class="brand-pill">JOMBATECH</span>
      STUDENT & ADMIN PORTAL
    </span>
  </div>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="dashboard.html" class="brand-name">JOMBATECH</a>
    </div>

    <nav class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="computer class.html">Computer Class</a>
      <a href="repair class.html">Repair Class</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <!-- Login Card Container -->
  <main class="login-wrapper">
    <div class="auth-card">
      
      <!-- Role Selector Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-student" type="button" onclick="switchRole('student')">Student Portal</button>
        <button class="tab-btn" id="tab-admin" type="button" onclick="switchRole('admin')">Admin Portal</button>
      </div>

      <!-- Header Text -->
      <div class="auth-header">
        <h2 id="portal-title">Student Login</h2>
        <p id="portal-subtitle">Access your enrolled courses and certificate records</p>
      </div>

      <!-- Authentication Form -->
      <form id="auth-form" onsubmit="handleLogin(event)">
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="student@jombatech.com" class="form-input">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <a href="forgot-password.html" style="color: #60a5fa; font-size: 0.78rem; text-decoration: none; font-weight: 600;">Forgot Password?</a>
          </div>
          <input type="password" id="password" required placeholder="••••••••" class="form-input">
        </div>

        <input type="hidden" id="user-role" value="student">

        <button type="submit" class="submit-btn" id="submit-btn">Login to Portal</button>
      </form>

      <!-- Registration Redirect -->
      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register Here</a></p>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 JombaTech Institute. All rights reserved.</p>
    </div>
  </footer>

  <script src="login.js"></script>
</body>
</html>
