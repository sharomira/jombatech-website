<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Resources | Jomba Tech Institute</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="stylesheet" href="students-resources.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="description">
    <span>
      <span class="brand-pill">JOMBATECH</span>
      STUDENT STUDY HUB & EXAM PORTAL
    </span>
  </div>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="dashboard.html" class="brand-name">JOMBATECH</a>
    </div>

    <nav class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="/students-resources" class="active-link">Resources</a>
      <a href="computer class.html">Computer Class</a>
      <a href="repair class.html">Repair Class</a>
      <button type="button" class="logout-btn" onclick="handleLogout()">Logout</button>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="resources-wrapper">
    <div class="resources-container">
      
      <!-- Welcome Header -->
      <div class="hub-header">
        <h2 id="welcome-title">Course Notes & Past Papers</h2>
        <p>Access downloadable lecture materials, practical revision guides, and practice exam questions.</p>
      </div>

      <!-- Course Category Filter Tabs -->
      <div class="category-tabs">
        <button class="tab-btn active" id="tab-all" onclick="filterCategory('all')">All Resources</button>
        <button class="tab-btn" id="tab-computer" onclick="filterCategory('computer')">Computer Packages</button>
        <button class="tab-btn" id="tab-repair" onclick="filterCategory('repair')">Electronics & Repair</button>
        <button class="tab-btn" id="tab-exams" onclick="filterCategory('exams')">Exam Questions</button>
      </div>

      <!-- Resources Grid (Dynamically Populated via JS) -->
      <div class="resources-grid" id="resources-grid">
        <p style="text-align: center; color: #94a3b8; grid-column: 1/-1;">Loading resources...</p>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 JombaTech Institute. All rights reserved.</p>
    </div>
  </footer>

  <script src="students-resources.js"></script>
</body>
</html>
